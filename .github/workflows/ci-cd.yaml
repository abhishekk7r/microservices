name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, discovery_server, inventory_service, notificaiton-service, order_service, product_service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn -B clean package

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-test-results
          path: ${{ matrix.service }}/target/surefire-reports/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [api-gateway, discovery_server, inventory_service, notificaiton-service, order_service, product_service]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # This step simulates docker building.
      # To push to DockerHub, uncomment the login step and set secrets.
      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: ./${{ matrix.service }}
          push: false # Change to true when DockerHub credentials are provided
          tags: yourapp/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
